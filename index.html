<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Registration Page</title>
</head>
<body>
<div class="form">
<h1>Register Here</h1>
<form action="#" method="post">
<div class="form-group">
<label for="First_Name">First Name:</label>
<input type="text" name="First_Name" id="First_Name" placeholder="Enter your name" required>
</div>
<div class="form-group">
<label for="Last_Name">Last Name:</label>
<input type="text" name="Last_Name" id="Last_Name" placeholder="Enter your last name" required>
</div>
<div class="form-group">
<label for="Email">Email:</label>
<input type="email" name="Email" id="Email" placeholder="Enter your email" required>
</div>
<div class="form-group">
<label for="Password">Password:</label>
<input type="password" name="Password" id="Password" placeholder="Enter your password" required>
</div>
<div class="form-group">
<label for="Gender">Gender:</label>
<select name="Gender" id="Gender" placeholder="Enter your gender" required>
<option value="male">Male</option>
<option value="female">Female</option>
</div>
<div class="form-group">
<label for="Submit">Submit</label>
<input type="submit" value="Register" class="btn btn-primary" disabled>
</div>
</div>
</form>
</body>
</html>
